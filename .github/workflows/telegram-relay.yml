name: Telegram relay

on:
  # Run automatically every five minutes. workflow_dispatch keeps the manual
  # Run workflow button available for testing and recovery.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-relay
  cancel-in-progress: false

jobs:
  relay:
    if: vars.RELAY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_ID: ${{ secrets.TELEGRAM_API_ID }}
      API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Add more source channels separated by commas; the target stays fixed.
      SOURCE_CHANNELS: "@aetherjapanresearch,@globaletfi"
      TARGET_CHANNEL: "@noche_economic"
      RUN_MODE: poll
      STATE_BACKEND: supabase
      EDIT_LOOKBACK: "100"
      POLL_SETTLE_SECONDS: "30"
      LOG_LEVEL: INFO
      SILENT: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Relay new posts
        run: PYTHONPATH=src python -m noche_relay
